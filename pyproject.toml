[project]
name = "fduplex-git-remote-s3"
version = "0.4.2"
description = "A git remote helper for Amazon S3"
authors = [{ name = "FullDuplex Media", email = "contact@fullduplex.media" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
classifiers = [
    "Topic :: Software Development :: Version Control",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "boto3>=1.42.24,<2.0.0",
    "botocore>=1.42.24,<2.0.0",
    "urllib3>=2.7.0,<3.0.0",
    "dnspython>=2.7.0,<3.0.0",
    "aws-s3-access-grants-boto3-plugin>=1.3.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/fduplex/git-remote-s3"

[project.scripts]
git-remote-s3 = "git_remote_s3.remote:main"
git-lfs-s3 = "git_remote_s3.lfs:main"
git-s3 = "git_remote_s3.manage:main"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest>=9.0.3,<10.0.0",
    "coverage>=7.6.1,<8.0.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "git_remote_s3"
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM"]
ignore = ["SIM117"]

[tool.ruff.lint.per-file-ignores]
# Tests use tempfile.NamedTemporaryFile for its .name; the file must outlive the
# write block, so SIM115's with-statement rewrite would delete it and break tests.
"test/**" = ["SIM115"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
